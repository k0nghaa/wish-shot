constraints:
  - "Data access is server-mediated via Next.js Server Components/Server Actions/Route Handlers using the Supabase service-role key, never client-direct supabase-js"
  - "Every query applies an explicit server-side WHERE user_id = <owner UID> filter (owner UID established by Round 1's login gate)"
  - "Old useCategories/useProducts/useImageUpload hooks and all old Express backend routes are fully removed once their Next.js equivalents are in place"
  - "Image upload MIME validation restricted to image/jpeg,image/png,image/webp with no size limit; rejection returns the Korean error \"JPG, PNG, WEBP 형식만 업로드 가능해요.\""
  - "Category name uniqueness is enforced at the Postgres layer; a duplicate-name creation attempt (Postgres error 23505) is translated to the existing Korean 409 response"
  - "All user-facing strings (errors, labels) remain in Korean"
  - "Design-system consistency: use semantic Tailwind color tokens, not raw Tailwind palette colors"
  - "Actual image rendering may use a temporary/local reference in this round — signed-URL-based Storage rendering is finalized in Round 3; do not block this round's Server Components on Storage being wired up"

