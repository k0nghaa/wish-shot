  existing_patterns:
    - Raw SQL via prepared statements (db.prepare(...).run/all()), no ORM or
      query builder
    - Server-mediated data access (frontend never talks to the DB directly)
    - All user-facing strings (errors, labels) in Korean
  existing_dependencies:
    - better-sqlite3 (source DB, read during migration)
    - pg / postgres.js (new DB access layer — direct analog to the existing
      db.prepare raw-SQL pattern; NOT a query builder/ORM)
    - jose (direct JWT verification against Supabase's JWKS endpoint —
      user's explicit personal auth-learning choice; not via supabase-js or
      @supabase/ssr)
    - Supabase (Postgres + Auth only in this round; Storage is round 3)
    - Next.js App Router (bare scaffold needed for the login route/Server
      Action and migration script location)
    - React 19 + TypeScript (minimal login page only in this round)

constraints:
  - "Local-only deliverable: no production deployment (Supabase/Vercel project creation, env var provisioning, DNS) is in scope"
  - "Phase 1 is a single-owner personal login gate, NOT multi-tenant; RLS is NOT enabled"
  - "Data access is server-mediated via Next.js Server Components/Server Actions/Route Handlers using the Supabase service-role key, never client-direct supabase-js"
  - "Every query applies an explicit server-side WHERE user_id = <owner UID> filter; user_id is backfilled to the owner on every migrated row"
  - "No public signup page exists; the single owner Auth account is pre-provisioned manually via local Supabase Studio and its UID injected into the migration script"
  - "One-shot offline cutover; the migration script is NOT required to be idempotent or re-runnable"
  - "Raw-SQL convention is scoped to the DB layer via pg/postgres.js — no query builder/ORM; if a connection pooler is used, it must be compatible with PgBouncer transaction-mode pooling (no session-level features such as prepared-statement caching that break under transaction pooling)"
  - "Auth is verified directly: the app validates the Supabase-issued JWT itself using jose against Supabase's published JWKS (exp, iss, aud, and sub claims), rather than delegating to supabase-js/@supabase/ssr or hand-rolling cryptographic signature verification; sub carries the owner UID and must match the owner UID used for backfill/filtering"
  - "backend/wishlist.db is kept untouched on disk until the round-3 verification script passes and the user personally reviews any orphan report; local Supabase stack must not be wiped (no `supabase db reset` / `supabase stop --no-backup`) during that review window — EXCEPT that a wipe-and-retry of the local Supabase stack is allowed if migration fails before a clean verification pass; the no-wipe rule applies only during the post-success review window (minimum 72 hours / 3 days)"
  - "All user-facing strings (errors, labels) are in Korean"

