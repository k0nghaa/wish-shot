goal: >
  Round 1 of 3 — Lay the data + auth foundation for migrating WishShot from
  Vite SPA + Express + better-sqlite3 to Next.js (App Router) + Supabase
  (Postgres + Auth). Deliver: (a) a one-shot script migrating existing
  categories/products from SQLite into Supabase Postgres via pg/postgres.js
  with owner user_id backfilled, and (b) an owner-only login gate using
  directly-implemented JWT verification (jose + Supabase JWKS), with no
  signup page and no RLS. Image migration (Storage) and page rendering are
  deferred to later rounds.

