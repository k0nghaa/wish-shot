    semantic_ac_key: ac_cd640b7aa548b62a
    expected_artifacts:
      - app
      - docs/e2e-checklist.md

ontology_schema:
  name: WishShotMigrationRound1
  description: >
    Data + auth foundation for the WishShot migration: the migrated
    category/product rows, the owner account, and the JWT claims used to
    gate access.
  fields:
    - name: category
      type: object
      description: A wishlist category row with unique name (categories table)
      required: true
    - name: product
      type: object
      description: A wishlist product row referencing a category and a backfilled owner user_id
      required: true
    - name: owner_account
      type: object
      description: The single pre-provisioned Supabase Auth owner account whose UID gates and filters all data
      required: true
    - name: jwt_claims
      type: object
      description: >
        The exp/iss/aud/sub claims validated directly against Supabase's
        JWKS via jose during owner login; sub carries the owner UID
      required: true
    - name: migration_run
      type: object
      description: A one-shot, non-idempotent execution moving SQLite category/product rows into Supabase Postgres
      required: true

evaluation_principles:
  - name: data_fidelity
    description: Migrated Postgres rows exactly match the SQLite source, proven by row-count parity
    weight: 1.0
  - name: security_posture
    description: Owner-only login gate correctly validates exp/iss/aud/sub via jose/JWKS; no client-direct DB/auth bypass
    weight: 0.9
  - name: architecture_alignment
    description: Server-mediated access via Server Components/Server Actions with service-role key and explicit user_id filtering, mirroring the existing raw-SQL server layer
    weight: 0.8
  - name: safety_of_backups
    description: Source SQLite DB remains untouched during this round; migration script does not delete or mutate backend/wishlist.db
    weight: 0.8

exit_conditions:
  - name: round1_verified
    description: Migration script runs cleanly against the current wishlist.db and owner login works end-to-end
    criteria: >
      scripts/migrate.ts produces row-count parity with backend/wishlist.db
      for categories/products, and the manual E2E checklist confirms owner
      login succeeds via the jose/JWKS verification path

